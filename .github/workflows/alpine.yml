name: Alpine build
on:
  workflow_dispatch:
  push:
    paths:
      - '*.c'
      - '*.h'
      - 'Makefile'
      - 'tools/**'
      - 'scripts/install_alpine.sh'
      - '.github/workflows/alpine.yml'
  pull_request:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install userspace tools without kernel headers
        run: |
          docker run --rm -v "$PWD:/src" -w /src alpine:3.24 sh -ec '
            sh scripts/install_alpine.sh tools
            test -x /usr/local/bin/brutalctl
            apk info -e iproute2
          '
      - name: Compile with Alpine virt kernel headers and musl
        run: |
          docker run --rm -v "$PWD:/src" -w /src alpine:3.24 sh -ec '
            apk add --no-cache build-base linux-virt-dev kmod bash
            bash -n scripts/alpine.sh
            bash scripts/alpine.sh --help
            sh -n scripts/install_alpine.sh
            sh scripts/install_alpine.sh --help
            set -- /lib/modules/*-virt/build
            test "$#" -eq 1
            make KERNEL_DIR="$1"
            test -s brutal.ko
            modinfo ./brutal.ko
            make -C tools
          '
