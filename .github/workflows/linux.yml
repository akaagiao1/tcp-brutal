name: Linux distributions
on:
  workflow_dispatch:
  push:
    paths: ['scripts/**', 'tests/**', '.github/workflows/linux.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ['alpine:3.24', 'debian:13', 'quay.io/centos/centos:stream9']
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies, test rules, compile module
        env:
          DISTRO_IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$DISTRO_IMAGE" sh -ec '
            if command -v apk >/dev/null; then apk add --no-cache bash; fi
            bash tests/linux-build.sh
          '
